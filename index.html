<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" name="viewport"/>
<title>FF · 工作台</title>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="default" name="apple-mobile-web-app-status-bar-style"/>
<meta content="FF" name="apple-mobile-web-app-title"/>
<meta content="#3a7d44" name="theme-color"/>
<meta content="FF 工作台 - 生活日常 · 饮茶日常 · 英语口语 · 攻略制作" name="description"/>
<link href="manifest.json" rel="manifest"/>
<link href="icon-192.png" rel="apple-touch-icon"/>
<style>
:root{
  --bg:#f0f7f1;
  --bg-soft:#e8f3e9;
  --sidebar:#3a7d44;
  --sidebar-deep:#2d6335;
  --primary:#4caf50;
  --primary-deep:#388e3c;
  --primary-light:#a5d6a7;
  --primary-bg:#e8f5e9;
  --accent:#66bb6a;
  --text:#1f3d23;
  --text-soft:#547058;
  --text-light:#7a9580;
  --card:#ffffff;
  --border:#d6e8d8;
  --border-soft:#e8f3e9;
  --danger:#e57373;
  --warn:#ffb74d;
  --info:#64b5f6;
  --shadow:0 2px 12px rgba(58,125,68,.08);
  --shadow-hover:0 6px 20px rgba(58,125,68,.15);
  --radius:12px;
  --radius-sm:8px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

.app{display:flex;height:100vh;overflow:hidden}

/* 侧边栏 */
.sidebar{
  width:260px;
  background:linear-gradient(180deg,var(--sidebar) 0%,var(--sidebar-deep) 100%);
  color:#fff;
  display:flex;
  flex-direction:column;
  padding:20px 14px;
  flex-shrink:0;
  position:relative;
  transition:transform .25s ease,width .25s ease;
  z-index:20;
}
.sidebar.collapsed{transform:translateX(-100%);width:0;padding:0;overflow:hidden}

/* 顶栏汉堡按钮 */
.sidebar-toggle{
  display:flex;
  width:36px;height:36px;
  background:transparent;border:none;border-radius:8px;
  color:var(--text-soft);cursor:pointer;font-size:20px;
  align-items:center;justify-content:center;
  margin-right:10px;transition:all .2s;flex-shrink:0;
}
.sidebar-toggle:hover{background:var(--primary-bg);color:var(--primary-deep)}

/* 移动端遮罩 */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);
  z-index:15;animation:fadein .2s;
}
.sidebar-overlay.show{display:block}
.logo{
  display:flex;align-items:center;gap:12px;
  padding:8px 10px 20px;border-bottom:1px solid rgba(255,255,255,.15);
  margin-bottom:18px;
}
.logo-icon{
  width:44px;height:44px;border-radius:12px;
  background:#fff;color:var(--sidebar-deep);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:18px;letter-spacing:1px;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.logo-text{font-size:18px;font-weight:600;letter-spacing:1px}

.nav{flex:1;display:flex;flex-direction:column;gap:6px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 12px;border:none;border-radius:10px;
  background:transparent;color:rgba(255,255,255,.85);
  cursor:pointer;text-align:left;transition:all .2s;
  font-family:inherit;
}
.nav-item:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-item.active{background:rgba(255,255,255,.95);color:var(--sidebar-deep);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.nav-emoji{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.nav-info{flex:1;min-width:0}
.nav-title{font-size:15px;font-weight:600;margin-bottom:2px}
.nav-desc{font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sidebar-footer{margin-top:14px}
.quote-card{
  background:rgba(255,255,255,.12);
  border-radius:10px;padding:12px;
  border:1px solid rgba(255,255,255,.15);
}
.quote-label{font-size:11px;opacity:.7;margin-bottom:6px;letter-spacing:1px}
.quote-text{font-size:13px;line-height:1.5}

.data-mgmt{display:flex;gap:6px;margin-top:10px}
.data-btn{
  flex:1;background:rgba(255,255,255,.15);
  color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.2);
  border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;
  font-family:inherit;transition:all .2s;
}
.data-btn:hover{background:rgba(255,255,255,.25);color:#fff}

/* 主区 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;background:var(--card);
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 3px rgba(58,125,68,.04);
}
.topbar-left{display:flex;align-items:center}
.topbar-left h1{font-size:20px;font-weight:700;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-actions{display:flex;gap:4px}
.topbar-action-btn{
  width:32px;height:32px;border:none;border-radius:8px;
  background:var(--primary-bg);color:var(--primary-deep);
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.topbar-action-btn:hover{background:var(--primary);color:#fff}
.breadcrumb{font-size:13px;color:var(--text-light);margin-top:2px}
.date-display{
  font-size:13px;color:var(--text-soft);
  background:var(--primary-bg);padding:8px 16px;border-radius:20px;
  border:1px solid var(--border);
}

.content{flex:1;overflow-y:auto;padding:24px 28px}

.module{display:none;animation:fadein .3s ease}
.module.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 通用卡片 */
.card-label{
  font-size:13px;font-weight:600;color:var(--text-soft);
  margin-bottom:10px;letter-spacing:.5px;
  display:flex;align-items:center;gap:6px;
}
.card-label::before{
  content:"";width:3px;height:14px;background:var(--primary);
  border-radius:2px;
}

.btn-primary,.btn-secondary{
  border:none;border-radius:8px;padding:10px 18px;
  font-size:14px;font-weight:500;cursor:pointer;
  font-family:inherit;transition:all .2s;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-deep);box-shadow:0 4px 10px rgba(76,175,80,.3)}
.btn-secondary{background:var(--primary-bg);color:var(--primary-deep);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--primary-light);color:#fff}
.btn-secondary:disabled,.btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* ============ 生活日常 ============ */
.life-wrap{display:flex;flex-direction:column;gap:18px;max-width:900px}
.life-tabs{display:flex;gap:8px}
.life-tab{
  background:var(--card);border:1px solid var(--border);
  padding:10px 20px;border-radius:8px;cursor:pointer;
  font-size:14px;font-weight:500;color:var(--text-soft);font-family:inherit;
  transition:all .2s;
}
.life-tab:hover{border-color:var(--primary)}
.life-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.life-panel{display:none}
.life-panel.active{display:block;animation:fadein .3s}

.todo-input-card,.todo-stats,.todo-filter{
  background:var(--card);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);border:1px solid var(--border-soft);
}
.todo-form{display:flex;gap:10px;flex-wrap:wrap}
.todo-input,.todo-select{
  border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;font-size:14px;background:#fafdfb;
  font-family:inherit;color:var(--text);
}
.todo-input{flex:1;min-width:200px}
.todo-input:focus,.todo-select:focus{outline:none;border-color:var(--primary);background:#fff}

.todo-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{
  text-align:center;padding:10px;border-radius:8px;
  background:var(--primary-bg);
}
.stat-num{font-size:28px;font-weight:700;color:var(--primary-deep)}
.stat-done{color:var(--primary)}
.stat-pending{color:var(--warn)}
.stat-rate{color:var(--info)}
.stat-label{font-size:12px;color:var(--text-soft);margin-top:4px}

.todo-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-btn{
  border:1px solid var(--border);background:#fafdfb;
  padding:6px 14px;border-radius:18px;cursor:pointer;
  font-size:13px;color:var(--text-soft);font-family:inherit;transition:all .2s;
}
.filter-btn:hover{border-color:var(--primary);color:var(--primary-deep)}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-clear{margin-left:auto;background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:13px;font-family:inherit}
.btn-clear:hover{text-decoration:underline}

.todo-list{display:flex;flex-direction:column;gap:8px}
.todo-item{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);padding:12px 16px;
  box-shadow:var(--shadow);transition:all .2s;
}
.todo-item:hover{box-shadow:var(--shadow-hover);transform:translateX(2px)}
.todo-check{
  width:22px;height:22px;border:2px solid var(--border);
  border-radius:50%;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:#fff;transition:all .2s;
}
.todo-check.done{background:var(--primary);border-color:var(--primary);color:#fff}
.todo-check.done::after{content:"✓";font-size:14px;font-weight:bold}
.todo-content{flex:1;font-size:14px}
.todo-item.done .todo-content{text-decoration:line-through;color:var(--text-light)}
.todo-priority{
  font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;
}
.todo-priority.high{background:#ffebee;color:#c62828}
.todo-priority.mid{background:#fff8e1;color:#f57f17}
.todo-priority.low{background:#e8f5e9;color:#2e7d32}
.todo-time{font-size:12px;color:var(--text-light)}
.todo-delete{
  background:transparent;border:none;color:var(--text-light);
  cursor:pointer;font-size:16px;padding:4px 8px;border-radius:4px;
  transition:all .2s;
}
.todo-delete:hover{color:var(--danger);background:#ffebee}

.empty-state{
  text-align:center;padding:40px 20px;color:var(--text-light);
  background:var(--card);border-radius:var(--radius);
  border:2px dashed var(--border);
}
.empty-icon{font-size:40px;margin-bottom:10px}

/* 每日灵感 */
.inspire-input-card{
  background:var(--card);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);border:1px solid var(--border-soft);
}
.inspire-form{display:flex;flex-direction:column;gap:10px}
.inspire-textarea{
  border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;font-size:14px;background:#fafdfb;
  font-family:inherit;color:var(--text);min-height:100px;resize:vertical;line-height:1.6;
}
.inspire-textarea:focus{outline:none;border-color:var(--primary);background:#fff}

.inspire-list{display:flex;flex-direction:column;gap:10px}
.inspire-item{
  background:var(--card);border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);padding:16px;
  box-shadow:var(--shadow);transition:all .2s;
}
.inspire-item:hover{box-shadow:var(--shadow-hover)}
.inspire-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.inspire-item-date{font-size:12px;color:var(--text-light);font-weight:500}
.inspire-item-body{font-size:14px;color:var(--text);line-height:1.7;white-space:pre-wrap}
.inspire-item-del{
  background:transparent;border:none;color:var(--text-light);
  cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;
}
.inspire-item-del:hover{color:var(--danger);background:#ffebee}

/* 灵感图片 */
.inspire-img-row{display:flex;align-items:center;gap:10px}
.inspire-img-btn{
  display:inline-block;background:var(--primary-bg);color:var(--primary-deep);
  border:1px solid var(--border);border-radius:8px;padding:8px 14px;
  font-size:13px;cursor:pointer;font-weight:500;transition:all .2s;
}
.inspire-img-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.inspire-img-tip{font-size:12px;color:var(--text-light)}
.inspire-img-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.inspire-img-preview:empty{display:none}
.inspire-img-thumb{
  position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;
  border:1px solid var(--border);
}
.inspire-img-thumb img{width:100%;height:100%;object-fit:cover}
.inspire-img-thumb .thumb-del{
  position:absolute;top:2px;right:2px;width:20px;height:20px;
  background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;
  font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  line-height:1;
}
.inspire-item-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.inspire-item-images:empty{display:none}
.inspire-item-img{
  width:100px;height:100px;border-radius:8px;overflow:hidden;
  border:1px solid var(--border);cursor:pointer;transition:transform .2s;
}
.inspire-item-img:hover{transform:scale(1.03)}
.inspire-item-img img{width:100%;height:100%;object-fit:cover}

/* 图片放大查看 */
.img-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadein .2s;
}
.img-modal img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
.img-modal-close{
  position:absolute;top:16px;right:16px;width:36px;height:36px;
  background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:50%;
  font-size:20px;cursor:pointer;
}

/* 每日茶知识 */
.tea-daily-card{
  background:linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 100%);
  border-radius:var(--radius);padding:18px 20px;
  border:1px solid var(--border);box-shadow:var(--shadow);
}
.tea-daily-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tea-daily-icon{font-size:20px}
.tea-daily-label{font-size:14px;font-weight:600;color:var(--primary-deep)}
.tea-daily-content{font-size:14px;color:var(--text-soft);line-height:1.7}
.tea-daily-content p{margin:0}

/* 紫砂壶泥料推荐 */
.pot-recommend{
  background:linear-gradient(135deg,#f3e5f5 0%,#e8d5b7 20%,#d7ccc8 50%,#c8b6a6 80%,#f5e6d3 100%);
  border-radius:var(--radius-sm);padding:16px;
  margin-top:14px;border:1px solid rgba(139,69,19,.15);
}
.pot-recommend-title{
  font-size:14px;font-weight:600;color:#5d4037;
  margin-bottom:4px;display:flex;align-items:center;gap:6px;
}
.pot-recommend-sub{font-size:12px;color:#8d6e63;margin-bottom:12px}
.pot-recommend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pot-clay-item{
  background:rgba(255,255,255,.85);border-radius:8px;padding:12px;
  border:1px solid rgba(139,69,19,.1);
}
.pot-clay-best{border:2px solid #8d6e63;box-shadow:0 2px 8px rgba(139,69,19,.15)}
.pot-clay-name{font-size:14px;font-weight:600;color:#5d4037;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pot-clay-priority{
  font-size:11px;background:#5d4037;color:#fff;padding:1px 8px;border-radius:8px;font-weight:500;
}
.pot-clay-reason{font-size:12px;color:#4e342e;line-height:1.6;margin-bottom:6px}
.pot-clay-char{font-size:11px;color:#8d6e63;font-style:italic}
.pot-clay-tea{font-size:11px;color:var(--primary-deep);margin-top:6px;font-weight:500}
.pot-not-rec{
  margin-top:10px;font-size:12px;color:#6d4c41;line-height:1.5;
  background:rgba(255,243,224,.6);padding:8px 12px;border-radius:6px;
  border-left:3px solid #ffb74d;
}

/* ============ 饮茶日常 ============ */
.tea-wrap{display:grid;grid-template-columns:1fr;gap:18px;max-width:1000px}
.tea-search-card,.eng-control-card,.eng-article-card,.eng-record-card,
.guide-search-card,.guide-detail,.guide-create-card,.my-guides-card{
  background:var(--card);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);border:1px solid var(--border-soft);
}
.tea-search-row{display:flex;gap:10px;margin-bottom:14px}
.tea-input,.eng-select,.guide-input{
  flex:1;border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;font-size:14px;background:#fafdfb;
  font-family:inherit;color:var(--text);
}
.tea-input:focus,.eng-select:focus,.guide-input:focus{outline:none;border-color:var(--primary);background:#fff}
.tea-tags{display:flex;flex-wrap:wrap;gap:8px}
.tea-tag{
  background:var(--primary-bg);color:var(--primary-deep);
  padding:5px 12px;border-radius:16px;font-size:13px;
  cursor:pointer;border:1px solid var(--border);transition:all .2s;
}
.tea-tag:hover{background:var(--primary);color:#fff}

.tea-welcome{text-align:center;padding:50px 20px}
.welcome-icon{font-size:56px;margin-bottom:14px}
.welcome-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:8px}
.welcome-desc{color:var(--text-light);font-size:14px}

.tea-info{animation:fadein .3s ease}
.tea-header{
  display:flex;align-items:center;gap:16px;
  padding-bottom:16px;border-bottom:2px solid var(--primary-bg);margin-bottom:18px;
}
.tea-emoji{font-size:48px}
.tea-name{font-size:24px;font-weight:700;color:var(--text)}
.tea-cat{font-size:13px;color:var(--text-light);margin-top:4px}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.tea-param{
  background:var(--primary-bg);border-radius:8px;padding:12px;
  border:1px solid var(--border);
}
.tea-param-label{font-size:12px;color:var(--text-soft);margin-bottom:4px}
.tea-param-value{font-size:16px;font-weight:600;color:var(--primary-deep)}
.tea-section{margin-bottom:16px}
.tea-section-title{
  font-size:15px;font-weight:600;color:var(--text);
  margin-bottom:8px;padding-left:10px;border-left:3px solid var(--primary);
}
.tea-section-text{color:var(--text-soft);line-height:1.8;padding-left:13px}
.tea-steps{list-style:none;padding-left:13px}
.tea-steps li{
  padding:6px 0;color:var(--text-soft);
  display:flex;gap:10px;line-height:1.6;
}
.tea-steps li::before{
  content:counter(step);counter-increment:step;
  background:var(--primary);color:#fff;width:22px;height:22px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;flex-shrink:0;
}
.tea-steps{counter-reset:step}

/* ============ 英语口语 ============ */
.eng-wrap{display:flex;flex-direction:column;gap:18px;max-width:1000px}
.eng-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eng-select{flex:0 0 auto;min-width:200px}
.eng-speed{min-width:120px}
.eng-article-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px}
.eng-article-meta{font-size:12px;color:var(--text-light);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-soft)}
.eng-article-text{font-size:15px;line-height:1.9;color:var(--text)}
.eng-article-text .sentence{display:block;margin-bottom:8px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .2s}
.eng-article-text .sentence:hover{background:var(--primary-bg)}
.eng-article-text .sentence.reading{background:var(--primary-light);color:#fff}

.eng-record-list{display:flex;flex-direction:column;gap:8px}
.record-item{
  display:flex;align-items:center;gap:12px;
  background:var(--primary-bg);border-radius:8px;padding:10px 14px;
  border:1px solid var(--border);
}
.record-name{flex:1;font-size:13px;color:var(--text)}
.record-name .rec-article{font-weight:600;color:var(--text)}
.record-name .rec-time{font-size:11px;color:var(--text-light);margin-left:6px}
.record-play{
  background:var(--primary);color:#fff;border:none;
  border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;font-family:inherit;
}
.record-play:hover{background:var(--primary-deep)}
.record-del{background:transparent;border:none;color:var(--text-light);cursor:pointer;font-size:14px}

/* ============ 攻略制作 ============ */
.guide-wrap{display:flex;flex-direction:column;gap:18px}
.guide-tabs{display:flex;gap:8px}
.guide-tab{
  background:var(--card);border:1px solid var(--border);
  padding:10px 20px;border-radius:8px;cursor:pointer;
  font-size:14px;font-weight:500;color:var(--text-soft);font-family:inherit;
  transition:all .2s;
}
.guide-tab:hover{border-color:var(--primary)}
.guide-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.guide-panel{display:none}
.guide-panel.active{display:block;animation:fadein .3s}

.guide-detail{max-width:1000px}
.guide-info{animation:fadein .3s}
.guide-info-header{
  display:flex;align-items:center;gap:14px;
  padding-bottom:14px;border-bottom:2px solid var(--primary-bg);margin-bottom:16px;
}
.guide-info-emoji{font-size:40px}
.guide-info-title{font-size:22px;font-weight:700;color:var(--text)}
.guide-info-sub{font-size:13px;color:var(--text-light);margin-top:4px}
.guide-section{margin-bottom:18px}
.guide-section-title{
  font-size:15px;font-weight:600;color:var(--text);
  margin-bottom:10px;padding-left:10px;border-left:3px solid var(--primary);
}
.guide-section-text{color:var(--text-soft);line-height:1.8;padding-left:13px}
.guide-timeline{padding-left:13px}
.guide-timeline-item{
  position:relative;padding:8px 0 8px 22px;
  color:var(--text-soft);line-height:1.7;
}
.guide-timeline-item::before{
  content:"";position:absolute;left:4px;top:14px;
  width:8px;height:8px;border-radius:50%;background:var(--primary);
}
.guide-timeline-item::after{
  content:"";position:absolute;left:7px;top:24px;bottom:-8px;
  width:2px;background:var(--border);
}
.guide-timeline-item:last-child::after{display:none}
.guide-timeline-time{font-weight:600;color:var(--primary-deep);margin-right:8px}

.guide-tips{display:flex;flex-wrap:wrap;gap:8px;padding-left:13px}
.guide-tip{
  background:var(--primary-bg);color:var(--primary-deep);
  padding:4px 10px;border-radius:14px;font-size:12px;border:1px solid var(--border);
}

/* 制作攻略 */
.guide-form{display:flex;flex-direction:column;gap:10px}
.guide-textarea{
  border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;font-size:14px;background:#fafdfb;
  font-family:inherit;color:var(--text);min-height:80px;resize:vertical;line-height:1.6;
}
.guide-textarea:focus{outline:none;border-color:var(--primary);background:#fff}

.schedule-item{
  background:var(--primary-bg);border-radius:8px;padding:12px;
  margin-bottom:8px;border:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;
}
.schedule-item input{flex:1;min-width:120px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;background:#fff;font-family:inherit}
.schedule-item input:focus{outline:none;border-color:var(--primary)}
.schedule-time{flex:0 0 140px !important}
.schedule-del{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:4px 8px}

.checklist-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:var(--primary-bg);
  border-radius:6px;margin-bottom:6px;border:1px solid var(--border);
}
.checklist-item .chk-text{flex:1;font-size:13px}
.checklist-item .chk-del{background:transparent;border:none;color:var(--danger);cursor:pointer}
.checklist-add{display:flex;gap:8px;margin-top:6px}
.checklist-add .guide-input{flex:1}

.guide-actions{display:flex;gap:10px;margin-top:14px}

.my-guide-card{
  background:var(--primary-bg);border-radius:8px;padding:14px;
  margin-bottom:10px;border:1px solid var(--border);cursor:pointer;transition:all .2s;
}
.my-guide-card:hover{box-shadow:var(--shadow-hover);transform:translateX(2px)}
.my-guide-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.my-guide-meta{font-size:12px;color:var(--text-light)}
.my-guide-del{float:right;background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:14px}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@media(max-width:768px){

}

</style>

<script>
/* ============ FF 工作台 - 主逻辑 v2 ============ */

/* ---------- 工具函数 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const save = (k, v) => localStorage.setItem('ff_' + k, JSON.stringify(v));
const load = k => { try { return JSON.parse(localStorage.getItem('ff_' + k)) || null } catch(e){ return null } };
const todayStr = () => new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'long'});

/* ---------- 侧边栏切换 ---------- */
const moduleMap = {
  life: { title:'生活日常', desc:'记录每日待办事项与灵感想法' },
  tea:  { title:'饮茶日常', desc:'查询茶叶泡制方法与品饮要点' },
  english:{ title:'英语口语', desc:'每天跟读 VOA，提升发音语感' },
  guide:{ title:'攻略制作', desc:'查询与制作旅游/博物馆攻略' }
};
$$('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const m = btn.dataset.module;
    $$('.module').forEach(s => s.classList.remove('active'));
    $('#module-' + m).classList.add('active');
    $('#moduleTitle').textContent = moduleMap[m].title;
    $('#moduleDesc').textContent = moduleMap[m].desc;
  });
});

/* ---------- 顶栏日期 ---------- */
$('#dateDisplay').textContent = '📅 ' + todayStr();

/* ---------- 侧边栏折叠 ---------- */
let sidebarCollapsed = false;
const sidebar = document.querySelector('.sidebar');
const overlay = $('#sidebarOverlay');

function openSidebar(){
  sidebar.classList.remove('collapsed');
  overlay.classList.add('show');
  sidebarCollapsed = false;
}
function closeSidebar(){
  sidebar.classList.add('collapsed');
  overlay.classList.remove('show');
  sidebarCollapsed = true;
}

$('#sidebarToggle').addEventListener('click', () => {
  if(sidebarCollapsed) openSidebar();
  else closeSidebar();
});
overlay.addEventListener('click', closeSidebar);

// 点击导航项后自动收起（移动端体验）
$$('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    // 保留原切换逻辑
    if(window.innerWidth < 768) closeSidebar();
  });
});

/* ---------- 每日一句 ---------- */
const quotes = [
  '把每一天都当作新的开始。',
  '日拱一卒，功不唐捐。',
  '一口茶，一段时光，慢即是快。',
  '坚持，是平凡人非凡的秘诀。',
  '语言是通向世界的钥匙。',
  '行万里路，读万卷书。',
  '今天的努力，是明天的底气。',
  '小步快跑，持续迭代。'
];
$('#dailyQuote').textContent = quotes[new Date().getDate() % quotes.length];


/* ============================================
   数据导出/导入
============================================ */
function exportAllData(){
  const allData = {};
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key.startsWith('ff_')) allData[key] = JSON.parse(localStorage.getItem(key));
  }
  const blob = new Blob([JSON.stringify(allData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'FF-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importAllData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      const count = Object.keys(data).length;
      if(confirm(`即将导入 ${count} 组数据。\n\n当前数据会被覆盖，确定继续吗？`)){
        Object.entries(data).forEach(([k,v]) => {
          if(k.startsWith('ff_')) localStorage.setItem(k, JSON.stringify(v));
        });
        alert('✅ 数据导入成功！页面将刷新以应用更改。');
        location.reload();
      }
    }catch(err){
      alert('❌ 文件格式错误，请选择有效的 FF 备份文件 (.json)');
    }
  };
  reader.readAsText(file);
}
// 侧边栏按钮
$('#exportDataBtn').addEventListener('click', exportAllData);
$('#importDataBtn').addEventListener('click', () => $('#importFileInput').click());
$('#importFileInput').addEventListener('change', e => { importAllData(e.target.files[0]); e.target.value = ''; });
// 顶栏按钮
$('#exportDataBtn2').addEventListener('click', exportAllData);
$('#importDataBtn2').addEventListener('click', () => $('#importFileInput2').click());
$('#importFileInput2').addEventListener('change', e => { importAllData(e.target.files[0]); e.target.value = ''; });


/* ============================================
   模块一：生活日常 - 待办 + 灵感
============================================ */
// 子Tab切换
$$('.life-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.life-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    $$('.life-panel').forEach(p=>p.classList.remove('active'));
    $('#panel-' + tab.dataset.sub).classList.add('active');
  });
});

// --- 待办事项 ---
let todos = load('todos') || [];
let currentFilter = 'all';

function renderTodos(){
  const list = $('#todoList');
  let filtered = todos;
  if(currentFilter === 'pending') filtered = todos.filter(t=>!t.done);
  else if(currentFilter === 'done') filtered = todos.filter(t=>t.done);
  else if(currentFilter === 'high') filtered = todos.filter(t=>t.priority==='high');

  list.innerHTML = '';
  filtered.forEach(t => {
    const item = document.createElement('div');
    item.className = 'todo-item' + (t.done ? ' done' : '');
    item.innerHTML = `
      <div class="todo-check ${t.done?'done':''}" data-id="${t.id}"></div>
      <div class="todo-content">${escapeHtml(t.content)}</div>
      <span class="todo-priority ${t.priority}">${t.priority==='high'?'🔥 高':t.priority==='mid'?'⭐ 中':'🌱 低'}</span>
      <span class="todo-time">${t.time}</span>
      <button class="todo-delete" data-id="${t.id}">✕</button>
    `;
    list.appendChild(item);
  });

  $('#todoEmpty').style.display = filtered.length ? 'none' : 'block';
  const total = todos.length, done = todos.filter(t=>t.done).length;
  $('#statTotal').textContent = total;
  $('#statDone').textContent = done;
  $('#statPending').textContent = total - done;
  $('#statRate').textContent = total ? Math.round(done/total*100)+'%' : '0%';
}

function addTodo(){
  const input = $('#todoInput');
  const content = input.value.trim();
  if(!content) return;
  const priority = $('#todoPriority').value;
  todos.unshift({
    id: Date.now(),
    content, priority, done:false,
    time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})
  });
  save('todos', todos);
  input.value = '';
  renderTodos();
}

$('#addTodoBtn').addEventListener('click', addTodo);
$('#todoInput').addEventListener('keydown', e => { if(e.key==='Enter') addTodo(); });

$('#todoList').addEventListener('click', e => {
  const id = Number(e.target.dataset.id);
  if(e.target.classList.contains('todo-check')){
    const t = todos.find(x=>x.id===id); if(t){ t.done=!t.done; save('todos',todos); renderTodos(); }
  } else if(e.target.classList.contains('todo-delete')){
    todos = todos.filter(x=>x.id!==id); save('todos',todos); renderTodos();
  }
});

$$('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTodos();
  });
});

$('#clearDoneBtn').addEventListener('click', () => {
  todos = todos.filter(t=>!t.done); save('todos',todos); renderTodos();
});

renderTodos();

// --- 每日灵感 ---
let inspires = load('inspires') || [];
let pendingImages = []; // 待上传的图片（base64）

function renderInspires(){
  const list = $('#inspireList');
  list.innerHTML = '';
  inspires.forEach(ins => {
    const item = document.createElement('div');
    item.className = 'inspire-item';
    const imgHtml = (ins.images && ins.images.length)
      ? `<div class="inspire-item-images">${ins.images.map((src,i)=>
          `<div class="inspire-item-img" data-src="${src}"><img src="${src}" alt="灵感图片"></div>`
        ).join('')}</div>`
      : '';
    item.innerHTML = `
      <div class="inspire-item-header">
        <span class="inspire-item-date">${ins.date}${(ins.images&&ins.images.length)?' · 📷 '+ins.images.length+'张':''}</span>
        <button class="inspire-item-del" data-id="${ins.id}">✕</button>
      </div>
      <div class="inspire-item-body">${escapeHtml(ins.content)}</div>
      ${imgHtml}
    `;
    list.appendChild(item);
  });
  $('#inspireEmpty').style.display = inspires.length ? 'none' : 'block';
}

function renderPendingImages(){
  const box = $('#inspireImgPreview');
  box.innerHTML = '';
  pendingImages.forEach((src, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'inspire-img-thumb';
    thumb.innerHTML = `<img src="${src}"><button class="thumb-del" data-i="${i}">✕</button>`;
    box.appendChild(thumb);
  });
  $('#inspireImgTip').textContent = pendingImages.length ? `已选 ${pendingImages.length}/9 张` : '可选，最多9张';
}

// 图片选择
$('#inspireImgInput').addEventListener('change', e => {
  const files = Array.from(e.target.files);
  const remain = 9 - pendingImages.length;
  if(remain <= 0){ alert('最多只能添加9张图片'); e.target.value=''; return; }
  const toRead = files.slice(0, remain);
  if(files.length > remain) alert(`最多9张，已添加前 ${remain} 张`);
  let loaded = 0;
  toRead.forEach(file => {
    if(!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev => {
      // 压缩到合理大小（最大宽度800px）
      compressImage(ev.target.result, 800, 0.7, compressed => {
        pendingImages.push(compressed);
        loaded++;
        if(loaded === toRead.length){ renderPendingImages(); }
      });
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

// 图片压缩
function compressImage(dataUrl, maxWidth, quality, callback){
  const img = new Image();
  img.onload = () => {
    if(img.width <= maxWidth){ callback(dataUrl); return; }
    const scale = maxWidth / img.width;
    const canvas = document.createElement('canvas');
    canvas.width = maxWidth;
    canvas.height = img.height * scale;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    callback(canvas.toDataURL('image/jpeg', quality));
  };
  img.onerror = () => callback(dataUrl);
  img.src = dataUrl;
}

// 删除待上传图片
$('#inspireImgPreview').addEventListener('click', e => {
  if(e.target.classList.contains('thumb-del')){
    pendingImages.splice(Number(e.target.dataset.i), 1);
    renderPendingImages();
  }
});

function addInspire(){
  const input = $('#inspireInput');
  const content = input.value.trim();
  if(!content && !pendingImages.length) return;
  inspires.unshift({
    id: Date.now(),
    content: content || '（图片记录）',
    images: [...pendingImages],
    date: new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
  });
  save('inspires', inspires);
  input.value = '';
  pendingImages = [];
  renderPendingImages();
  renderInspires();
}
$('#addInspireBtn').addEventListener('click', addInspire);

// 点击放大图片
$('#inspireList').addEventListener('click', e => {
  if(e.target.closest('.inspire-item-img')){
    const src = e.target.closest('.inspire-item-img').dataset.src;
    showImageModal(src);
  }
});
function showImageModal(src){
  const modal = document.createElement('div');
  modal.className = 'img-modal';
  modal.innerHTML = `<button class="img-modal-close">✕</button><img src="${src}">`;
  modal.addEventListener('click', () => modal.remove());
  document.body.appendChild(modal);
}

$('#inspireList').addEventListener('click', e => {
  if(e.target.classList.contains('inspire-item-del')){
    inspires = inspires.filter(x=>x.id!==Number(e.target.dataset.id));
    save('inspires', inspires);
    renderInspires();
  }
});
renderInspires();

// 每天自动拉取 VOA Learning English 最新文章
async function fetchVOAArticles(){
  try {
    const rssUrl = 'https://learningenglish.voanews.com/api/zq$omekvi_omzrto';
    // 使用 rss2json 免费 API 代理
    const resp = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl));
    if(!resp.ok) throw new Error('fetch failed');
    const data = await resp.json();
    if(data.items && data.items.length){
      voaArticles = data.items.slice(0, 15).map(item => {
        // 清洗 HTML 标签，拆分为句子
        const raw = (item.description || item.content || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        const sentences = raw.match(/[^.!?]+[.!?]+/g) || [raw];
        return {
          title: item.title,
          meta: 'VOA Learning English · ' + new Date(item.pubDate).toLocaleDateString('zh-CN'),
          text: sentences.filter(s => s.length > 20).slice(0, 10)
        };
      });
      save('voaCache', voaArticles);
    }
  } catch(e){
    // 网络不通就用缓存或内置备用
    voaArticles = load('voaCache') || fallbackArticles;
  }
  renderArticleList();
  renderArticle();
}

function speak(text, highlightEl){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音合成'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = parseFloat($('#speedSelect').value);
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.startsWith('en') && /female|samantha|zira|google/i.test(v.name)) || voices.find(v=>v.lang.startsWith('en'));
  if(enVoice) u.voice = enVoice;

  $$('#engText .sentence').forEach(el => el.classList.remove('reading'));
  if(highlightEl) highlightEl.classList.add('reading');

  u.onend = () => { if(highlightEl) highlightEl.classList.remove('reading'); currentUtterance=null; };
  currentUtterance = u;
  window.speechSynthesis.speak(u);
}

$('#voaArticle').addEventListener('change', e => { currentArticleIdx = +e.target.value; renderArticle(); });

let mediaRecorder = null, audioChunks = [];
async function startRecord(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, {type:'audio/webm'});
      const url = URL.createObjectURL(blob);
      const rec = {
        id: Date.now(),
        article: voaArticles[currentArticleIdx].title,
        time: new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
        url
      };
      records.unshift(rec);
      save('records', records.map(r => ({...r, url: r.url.startsWith('blob:') ? null : r.url})));
      renderRecords();
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start();
    $('#recordBtn').disabled = true;
    $('#stopRecordBtn').disabled = false;
    $('#recordBtn').textContent = '🔴 录音中...';
  } catch(err){
    alert('无法访问麦克风：' + err.message + '\n请允许浏览器使用麦克风权限。');
  }
}
function stopRecord(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    mediaRecorder.stop();
  }
  $('#recordBtn').disabled = false;
  $('#stopRecordBtn').disabled = true;
  $('#recordBtn').textContent = '🎙 录音跟读';
}
$('#recordBtn').addEventListener('click', startRecord);
$('#stopRecordBtn').addEventListener('click', stopRecord);

function renderRecords(){
  const list = $('#recordList');
  list.innerHTML = '';
  records.forEach(r => {
    const item = document.createElement('div');
    item.className = 'record-item';
    const playBtn = r.url ? `<button class="record-play" data-url="${r.url}">▶ 播放</button>` : '<span style="font-size:12px;color:var(--text-light)">本会话录音已失效</span>';
    item.innerHTML = `
      <div class="record-name"><span class="rec-article">${escapeHtml(r.article)}</span><span class="rec-time">${r.time}</span></div>
      ${playBtn}
      <button class="record-del" data-id="${r.id}">✕</button>
    `;
    list.appendChild(item);
  });
  $('#recordEmpty').style.display = records.length ? 'none' : 'block';
}
$('#recordList').addEventListener('click', e => {
  if(e.target.classList.contains('record-play')){
    new Audio(e.target.dataset.url).play();

    records = records.filter(r=>r.id!==Number(e.target.dataset.id));
    save('records', records);
    renderRecords();
  }
});

    checklist: [...checklist],
    createdAt: new Date().toLocaleString('zh-CN')
  };
  myGuides.unshift(guide);
  save('myGuides', myGuides);
  renderMyGuides();
  alert('✅ 攻略已保存到"我的攻略"！');
});
$('#clearGuideBtn').addEventListener('click', () => {
  if(confirm('确定清空当前所有输入吗？')){
    $('#guideTitle').value=''; $('#guideDestination').value='';
    $('#guideDuration').value=''; $('#guideOverview').value='';
    schedules = []; checklist = []; renderSchedules(); renderChecklist();
  }
});

renderSchedules();
renderChecklist();
renderMyGuides();


/* ---------- 工具：HTML 转义 ---------- */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;') }

</script>
</body>
